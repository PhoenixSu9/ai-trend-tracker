name: AI Trend Tracker - Daily RSS Fetch

on:
  schedule:
    # Run daily at 00:00 UTC (8:00 AM Beijing Time)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install feedparser
      
      - name: Fetch RSS feeds
        run: |
          python scripts/fetch_rss.py
      
      - name: Commit and push daily data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add daily data
          git add data/daily/*.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            git commit -m "chore: update daily RSS data $(date +'%Y-%m-%d')"
            git push
            echo "✓ Pushed daily data updates"
          fi
